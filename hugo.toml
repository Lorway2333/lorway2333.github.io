baseURL = "https://lorway2333.github.io/"
locale = "zh-cn"
defaultContentLanguage = "zh"
title = "前哨"
theme = "PaperMod"

[pagination]
  pagerSize = 10

[params]
  env = "production"
  author = "罗怀爱"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = true
  UseHugoToc = true
mainSections = ["posts", "notes"]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Lorway2333"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "notes"
    name = "笔记"
    url = "/notes/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false